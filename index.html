<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared Schedule Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--card-alt:#f3f2ed;--ink:#1c1f24;--ink-soft:#3f444c;--mute:#7a7f87;
  --line:#e6e3dc;--line-soft:#efede8;--accent:#2f6f5e;--accent-soft:#e3efe9;--accent-ink:#ffffff;
  --warn:#9a5b07;--warnbg:#fdf3e1;--warn-border:#f0cf94;--ok:#22704f;--okbg:#e5f4ec;--ok-border:#a9d8bf;
  --head:#fbfaf7;--soft:#f1efe9;--free:rgba(47,145,104,.22);--free-border:#2f9168;--busy:rgba(90,95,105,.10);
  --unk1:#f6f5f1;--unk2:#eeece6;--study:#f1f6f3;--danger:#b4352b;--danger-bg:#fcecea;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.04);
  --font-serif:'Fraunces',Georgia,serif;--font-sans:'DM Sans',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121417;--card:#1a1d21;--card-alt:#20242a;--ink:#eceae6;--ink-soft:#c9c6c0;--mute:#8d9199;
  --line:#2a2e35;--line-soft:#23272d;--accent:#6fc3a6;--accent-soft:#1d3029;--accent-ink:#0e1a16;
  --warn:#f0bf68;--warnbg:#2a2113;--warn-border:#5a4520;--ok:#7ed3a8;--okbg:#14261d;--ok-border:#2f5a43;
  --head:#171a1e;--soft:#23272d;--free:rgba(111,195,166,.22);--free-border:#6fc3a6;--busy:rgba(200,200,210,.07);
  --unk1:#1a1d21;--unk2:#22262c;--study:#18241f;--danger:#f08a80;--danger-bg:#2c1716;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121417;--card:#1a1d21;--card-alt:#20242a;--ink:#eceae6;--ink-soft:#c9c6c0;--mute:#8d9199;
  --line:#2a2e35;--line-soft:#23272d;--accent:#6fc3a6;--accent-soft:#1d3029;--accent-ink:#0e1a16;
  --warn:#f0bf68;--warnbg:#2a2113;--warn-border:#5a4520;--ok:#7ed3a8;--okbg:#14261d;--ok-border:#2f5a43;
  --head:#171a1e;--soft:#23272d;--free:rgba(111,195,166,.22);--free-border:#6fc3a6;--busy:rgba(200,200,210,.07);
  --unk1:#1a1d21;--unk2:#22262c;--study:#18241f;--danger:#f08a80;--danger-bg:#2c1716;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 24px 64px}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink)}
h1{font-size:22px}h3{font-size:18px}
button{font:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:16px}
nav{display:inline-flex;gap:2px}
nav button{background:transparent;border:0;border-radius:999px;padding:8px 14px;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
nav button:hover{color:var(--ink);background:var(--card-alt)}
nav button.on{color:var(--ink);background:var(--card);box-shadow:var(--shadow);font-weight:600}
.user-actions{display:flex;gap:6px;align-items:center}

/* Buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.btn.ghost:hover{background:var(--card-alt);color:var(--ink)}
.btn.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok-border)}
.btn.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn-border)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.icon{width:34px;height:34px;padding:0}
.btn.quiet{background:transparent;border-color:transparent;color:var(--mute)}
.btn.quiet:hover{color:var(--ink);background:var(--card-alt)}
.btn.danger{color:var(--danger)}
.link{background:transparent;border:1px solid transparent;border-radius:999px;color:var(--ink-soft);padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.link:hover{background:var(--card-alt);color:var(--ink)}

/* Toolbars */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.wk-title{font-family:var(--font-serif);font-size:19px;font-weight:600;margin-left:8px}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.subbar .lbl{font-size:13px;color:var(--mute);margin-right:4px}
.tip{font-size:13px;color:var(--mute)}
.seg{display:inline-flex;background:var(--card-alt);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 14px;font-size:13px;font-weight:500;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mute,.hint{color:var(--mute)}
.hint{font-size:13px;margin:6px 0 0}

/* Inputs */
input,select{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;padding:0}
input[type=color]{width:38px;height:38px;padding:3px;flex:none;cursor:pointer}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:14px}
label>input,label>select{margin-top:6px;font-weight:400}
label.chk{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--ink);cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:none}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.chip:hover:not(:disabled){border-color:var(--mute);color:var(--ink)}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--ink)}
.chip:disabled{opacity:.6;cursor:default}
.chip small{opacity:.65;margin-left:6px;font-size:11px}

.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn-border);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Grid */
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;margin-bottom:16px;box-shadow:var(--shadow)}
.tg-head,.tg-body{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr))}
.gh{padding:10px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);background:var(--card)}
.gh small{display:block;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px}
.gh.today small{display:table;margin:2px auto 0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px}
.gh.today{color:var(--accent)}
.tg-times{position:relative}
.tg-times span{position:absolute;right:8px;font-size:11px;color:var(--mute);transform:translateY(-50%)}
.tg-times span.first{transform:none;top:3px}
.tg-col{position:relative;border-left:1px solid var(--line-soft);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px);background-size:100% var(--pph)}
.tg.edit .tg-col{cursor:crosshair}
.tg.edit .tg-col:hover{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.tg-col.unk{background-image:repeating-linear-gradient(-45deg,var(--unk1),var(--unk1) 6px,var(--unk2) 6px,var(--unk2) 12px);background-size:auto}
.blk{position:absolute;border-radius:7px;font-size:12px;font-weight:600;line-height:1.25;padding:4px 6px;overflow:hidden;cursor:pointer;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.blk:hover{filter:brightness(1.06);z-index:2}
.blk.priv{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 4px,transparent 4px 8px)}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:3}
.band{position:absolute;left:2px;right:2px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1.5px dashed var(--accent);border-radius:7px;pointer-events:none;z-index:4}
.freew{position:absolute;left:3px;right:3px;background:var(--free);border:1px solid var(--free-border);border-radius:7px;pointer-events:none}
.busyw{position:absolute;left:0;right:0;background:var(--busy);pointer-events:none}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .15s ease}
.modal{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .18s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-foot{display:flex;gap:8px;margin-top:20px;align-items:center}
.modal-foot .sp{margin-left:auto}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
details.more{margin:4px 0 0}
details.more summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}

/* Profile */
.plist{display:flex;flex-direction:column;gap:8px;margin:20px 0}
.prow{display:flex;gap:6px;align-items:stretch}
.pick{flex:1;text-align:left;padding:13px 16px;background:var(--card-alt);color:var(--ink);border:1px solid transparent;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center}
.pick:hover{border-color:var(--accent);background:var(--card)}
.x{background:transparent;border:0;border-radius:10px;color:var(--mute);padding:0 12px;font-size:13px;opacity:.6}
.prow:hover .x{opacity:1}
.x:hover{color:var(--danger);background:var(--danger-bg)}

/* Tasks */
.task{border-top:1px solid var(--line-soft);padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.task:first-child{border-top:0;padding-top:0}
.task:last-child{padding-bottom:0}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.task .acts{display:flex;gap:4px;align-items:center;opacity:.55;transition:opacity .15s}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.task select{width:auto;padding:5px 10px;font-size:13px;border-radius:999px}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mute);margin-left:8px;text-transform:capitalize}
.over{color:var(--danger);font-weight:600}
.empty{text-align:center;padding:28px 0;color:var(--mute)}
.study{width:100%;background:var(--study);border-radius:12px;padding:12px 16px;margin-top:4px;font-size:14px}
.study ol{margin:6px 0 0;padding-left:20px}
.err{color:var(--danger);background:var(--danger-bg);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trow input[type=text]{flex:1;min-width:0}
.win-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.win-chip{background:var(--okbg);color:var(--ok);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}

@media (max-width:720px){
  .wrap{padding:14px 12px 90px}
  .brand{gap:12px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:8px;justify-content:space-around;gap:0}
  nav button{font-size:13px;padding:8px 10px}
  .row2{grid-template-columns:1fr;gap:8px}
  .tg-head,.tg-body{grid-template-columns:38px repeat(7,minmax(0,1fr))}
  .gh{font-size:10px}.gh small{font-size:13px}
  .blk{font-size:10px;padding:2px 3px}
  .tip{display:none}
  .task .acts{opacity:1}
}
</style>
</head>

<div id="app"></div>

<!-- ============ PURE LOGIC (no DOM, no storage). Tested by test-logic.js ============ -->
<script id="logic">
const Logic = (() => {
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const DEFAULT_HOURS = { start: 7, end: 23 };
  const DEFAULT_TYPES = [
    { id: 'class', name: 'Class', color: '#3b6fd4', repeat: 'weekly' },
    { id: 'work', name: 'Work', color: '#e07b00', repeat: 'week' }
  ];
  const SLOT = 30;
  const pad = n => String(n).padStart(2, '0');

  function fmtTime(min) {
    const h24 = Math.floor(min / 60) % 24, m = min % 60;
    return (h24 % 12 === 0 ? 12 : h24 % 12) + (m ? ':' + pad(m) : '') + ' ' + (h24 >= 12 ? 'PM' : 'AM');
  }
  function fmtDur(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : '');
  }
  function parseTimeInput(str, isEnd) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || '').trim());
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    const v = h * 60 + mi;
    return isEnd && v === 0 ? 1440 : v;
  }
  function fmtTimeInput(min) { return min >= 1440 ? '00:00' : pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function snapFloor(min, snap) { return Math.floor(min / snap) * snap; }

  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function fmtDate(dt) { return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); }
  function addDays(s, n) { const d = parseDate(s); d.setUTCDate(d.getUTCDate() + n); return fmtDate(d); }
  function mondayOf(s) { const d = parseDate(s); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return fmtDate(d); }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

  function normalize(iv) {
    const a = iv.filter(x => x[1] > x[0]).map(x => [x[0], x[1]]).sort((p, q) => p[0] - q[0] || p[1] - q[1]);
    const out = [];
    for (const x of a) {
      const last = out[out.length - 1];
      if (last && x[0] <= last[1]) last[1] = Math.max(last[1], x[1]); else out.push(x);
    }
    return out;
  }
  function subtract(base, remove) {
    const rem = normalize(remove), out = [];
    for (const [s0, e0] of normalize(base)) {
      let s = s0;
      for (const [rs, re] of rem) {
        if (re <= s || rs >= e0) continue;
        if (rs > s) out.push([s, rs]);
        s = Math.max(s, re);
        if (s >= e0) break;
      }
      if (s < e0) out.push([s, e0]);
    }
    return out;
  }

  function blocksInWeek(blocks, personId, weekDate) {
    return blocks.filter(b => b.personId === personId && (b.weekDate == null || b.weekDate === weekDate));
  }
  function isConfirmed(confs, personId, weekDate) {
    return confs.some(c => c.personId === personId && c.weekDate === weekDate);
  }
  function busyByDay(blocks, personIds, weekDate) {
    const days = [[], [], [], [], [], [], []];
    for (const pid of personIds) for (const b of blocksInWeek(blocks, pid, weekDate)) days[b.day].push([b.start, b.end]);
    return days.map(normalize);
  }

  function freeWindows({ personIds, blocks, confirmations, weekDate, dayStart = DEFAULT_HOURS.start * 60, dayEnd = DEFAULT_HOURS.end * 60, minLen = 60 }) {
    const unconfirmedIds = personIds.filter(id => !isConfirmed(confirmations, id, weekDate));
    if (unconfirmedIds.length) return { windows: [], unconfirmedIds, blocked: true };
    if (!personIds.length) return { windows: [], unconfirmedIds: [], blocked: false };
    const windows = [];
    busyByDay(blocks, personIds, weekDate).forEach((busy, day) => {
      for (const [s, e] of subtract([[dayStart, dayEnd]], busy)) if (e - s >= minLen) windows.push({ day, start: s, end: e });
    });
    return { windows, unconfirmedIds: [], blocked: false };
  }

  function validateBlock(b, types) {
    const errors = [];
    if (!Number.isInteger(b.day) || b.day < 0 || b.day > 6) errors.push('Pick a valid day.');
    if (!Number.isInteger(b.start) || !Number.isInteger(b.end) || b.start < 0 || b.end > 1440) errors.push('Times must be within one day.');
    else if (b.end <= b.start) errors.push('End time must be after start time.');
    if (!types.some(t => t.id === b.type)) errors.push('Pick an event type.');
    if ((b.label || '').length > 40) errors.push('Label is too long (40 characters max).');
    return errors;
  }
  function validateType(t, types) {
    const errors = [], name = (t.name || '').trim();
    if (!name) errors.push('Type name is required.');
    else if (name.length > 20) errors.push('Type name is too long (20 characters max).');
    else if (types.some(x => x.id !== t.id && x.name.trim().toLowerCase() === name.toLowerCase())) errors.push('A type with that name already exists.');
    if (!/^#[0-9a-f]{6}$/i.test(t.color || '')) errors.push('Pick a valid color.');
    if (!['weekly', 'week'].includes(t.repeat)) errors.push('Pick how the type repeats.');
    return errors;
  }
  function weekDateFor(type, existingWeekDate, viewWeek) {
    return type.repeat === 'weekly' ? null : (existingWeekDate || viewWeek);
  }
  function blockDetail(b, type, viewerId) {
    if (b.private && b.personId !== viewerId) return 'Busy';
    return type.name + (b.label ? ': ' + b.label : '') + (b.private ? ' (private)' : '');
  }
  const DARK_TEXT = '#0f172a';
  function lum(hex) {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrastText(hex) {
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return '#fff';
    const L = lum(hex), white = 1.05 / (L + 0.05), dark = (L + 0.05) / (lum(DARK_TEXT) + 0.05);
    return dark > white ? DARK_TEXT : '#fff';
  }
  function layoutLanes(blocks) {
    const items = blocks.slice().sort((a, b) => a.start - b.start || b.end - a.end);
    const out = {}; let cluster = [], clusterEnd = -1, laneEnds = [];
    const flush = () => { const n = laneEnds.length; cluster.forEach(id => { out[id].lanes = n; }); cluster = []; laneEnds = []; clusterEnd = -1; };
    for (const b of items) {
      if (cluster.length && b.start >= clusterEnd) flush();
      let lane = laneEnds.findIndex(e => e <= b.start);
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(b.end); } else laneEnds[lane] = b.end;
      out[b.id] = { lane, lanes: 0 }; cluster.push(b.id); clusterEnd = Math.max(clusterEnd, b.end);
    }
    flush();
    return out;
  }
  function copyWeekBlocks(blocks, personId, fromWeek, toWeek, genId) {
    const mine = w => blocks.filter(b => b.personId === personId && b.weekDate === w);
    return {
      remove: mine(toWeek).map(b => b.id),
      add: mine(fromWeek).map(b => ({ id: genId(), personId, day: b.day, start: b.start, end: b.end, type: b.type, weekDate: toWeek, label: b.label || '', private: !!b.private }))
    };
  }

  const CATEGORIES = ['shared', 'group', 'personal'];
  function effectiveAssignees(task, people) {
    return task.category === 'shared' ? people.map(p => p.id) : task.assigneeIds.filter(id => people.some(p => p.id === id));
  }
  function validateTask(t, people) {
    const errors = [];
    if (!t.title || !t.title.trim()) errors.push('Title is required.');
    if (!CATEGORIES.includes(t.category)) errors.push('Pick a category.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate || '')) errors.push('Due date is required.');
    const n = t.category === 'shared' ? people.length : (t.assigneeIds || []).length;
    if (t.category === 'group' && n < 2) errors.push('Group tasks need at least 2 people.');
    if (t.category === 'personal' && n !== 1) errors.push('Personal tasks need exactly 1 person.');
    return errors;
  }
  function cascadeRemovePerson(db, personId) {
    const upsertTasks = [], deleteTaskIds = [];
    for (const t of db.tasks) {
      if (!t.assigneeIds.includes(personId)) continue;
      const rest = t.assigneeIds.filter(id => id !== personId);
      if (t.category === 'shared') upsertTasks.push({ ...t, assigneeIds: rest });
      else if (!rest.length) deleteTaskIds.push(t.id);
      else upsertTasks.push({ ...t, assigneeIds: rest, category: rest.length === 1 ? 'personal' : t.category });
    }
    return {
      blockIds: db.blocks.filter(b => b.personId === personId).map(b => b.id),
      confIds: db.confirmations.filter(c => c.personId === personId).map(c => c.id),
      upsertTasks, deleteTaskIds
    };
  }

  function todWeight(m) { const h = m / 60; return (h >= 10 && h < 20) ? 3 : (((h >= 8 && h < 10) || (h >= 20 && h < 22)) ? 2 : 1); }
  function bestSub(start, end, len) {
    const starts = [start];
    for (let s = Math.ceil(start / SLOT) * SLOT; s + len <= end; s += SLOT) if (s > start) starts.push(s);
    let best = null;
    for (const s of starts) {
      if (s + len > end) continue;
      let w = 0, n = 0; for (let m = s; m < s + len; m += SLOT) { w += todWeight(m); n++; }
      if (!best || w / n > best.w / best.n) best = { s, w, n };
    }
    return best;
  }
  function suggestStudySlots({ task, personIds, blocks, confirmations, today, nowMin = 0, minLen = 60, maxLen = 120, maxResults = 6, maxWeeks = 8, maxPerDay = 2, dayStart = DEFAULT_HOURS.start * 60, dayEnd = DEFAULT_HOURS.end * 60 }) {
    const out = { slots: [], skippedWeeks: [], truncated: false, status: 'ok' };
    if (!personIds.length) { out.status = 'no-assignees'; return out; }
    const lastDate = addDays(task.dueDate, -1);
    if (lastDate < today) { out.status = 'no-time-left'; return out; }
    let week = mondayOf(today), n = 0;
    const cands = [];
    while (week <= lastDate && n < maxWeeks) {
      const r = freeWindows({ personIds, blocks, confirmations, weekDate: week, dayStart, dayEnd, minLen });
      if (r.blocked) out.skippedWeeks.push({ weekDate: week, unconfirmedIds: r.unconfirmedIds });
      else for (const w of r.windows) {
        const date = addDays(week, w.day);
        if (date < today || date > lastDate) continue;
        let s = w.start;
        if (date === today) s = Math.max(s, Math.ceil(nowMin / SLOT) * SLOT);
        if (w.end - s < minLen) continue;
        const len = Math.min(maxLen, w.end - s);
        const b = bestSub(s, w.end, len);
        const score = (b.w / b.n) * 2 + Math.min(len, 120) / 60 + Math.min(daysBetween(date, task.dueDate), 4) * 0.5;
        cands.push({ date, day: w.day, start: b.s, end: b.s + len, score });
      }
      week = addDays(week, 7); n++;
    }
    out.truncated = week <= lastDate;
    cands.sort((a, b) => b.score - a.score || (a.date < b.date ? -1 : a.date > b.date ? 1 : a.start - b.start));
    const perDay = {};
    for (const c of cands) {
      if (out.slots.length >= maxResults) break;
      if ((perDay[c.date] || 0) >= maxPerDay) continue;
      perDay[c.date] = (perDay[c.date] || 0) + 1;
      out.slots.push(c);
    }
    if (!out.slots.length) out.status = out.skippedWeeks.length ? 'waiting-confirmation' : 'no-windows';
    return out;
  }

  return { DAYS, DEFAULT_HOURS, DEFAULT_TYPES, fmtTime, fmtDur, parseTimeInput, fmtTimeInput, snapFloor, parseDate, addDays, mondayOf,
    daysBetween, normalize, subtract, blocksInWeek, isConfirmed, busyByDay, freeWindows, validateBlock, validateType, weekDateFor,
    blockDetail, contrastText, layoutLanes, copyWeekBlocks, effectiveAssignees, validateTask, cascadeRemovePerson, suggestStudySlots };
})();
if (typeof module !== 'undefined') module.exports = Logic;
</script>

<!-- ============ STORAGE ADAPTER ============ -->
<script id="storage">
const Repo = (() => {
  const KEY = 'sp.db.v1';
  const empty = () => ({ people: [], blocks: [], confirmations: [], tasks: [], types: [] });
  const read = () => { try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return empty(); } };
  const write = db => localStorage.setItem(KEY, JSON.stringify(db));
  return {
    async loadAll() { return read(); },
    async upsert(table, rows) {
      const db = read();
      for (const r of [].concat(rows)) {
        const i = db[table].findIndex(x => x.id === r.id);
        if (i >= 0) db[table][i] = r; else db[table].push(r);
      }
      write(db);
    },
    async remove(table, ids) {
      const set = new Set([].concat(ids)), db = read();
      db[table] = db[table].filter(x => !set.has(x.id));
      write(db);
    },
    onExternalChange(cb) { window.addEventListener('storage', e => { if (e.key === KEY) cb(); }); }
  };
})();
</script>

}
function blkHTML(b, o) {

}
function gridHTML(colFn, cls) {

            title: p.name + ': ' + L.blockDetail(b, tOf(b.type), S.me) })).join('');

    }), 'ev');
    const pb = S.peek && S.db.blocks.find(b => b.id === S.peek), pp = pb && person(pb.personId);
    const peek = pb && pp ? `<div class="banner" style="background:var(--card);color:var(--ink);border-color:${pp.color}"><span><span class="dot" style="background:${pp.color}"></span><b>${esc(pp.name)}</b> &middot; ${DAYS[pb.day]} ${L.fmtTime(pb.start)} &ndash; ${L.fmtTime(pb.end)} &middot; ${esc(L.blockDetail(pb, tOf(pb.type), S.me))}</span><button class="btn sm ghost" data-act="closepeek">&#10005;</button></div>` : '';

    const sel = selIds();
    const res = L.freeWindows({ personIds: sel, blocks: S.db.blocks, confirmations: S.db.confirmations, weekDate: S.week, dayStart: hs(), dayEnd: he(), minLen: S.minLen });
    const busy = L.busyByDay(S.db.blocks, sel, S.week);
    const chips = ps.map(p => `<button class="chip ${sel.includes(p.id) ? 'on' : ''}" style="--c:${p.color}" data-act="gsel" data-id="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${L.isConfirmed(S.db.confirmations, p.id, S.week) ? '' : ' &#9888;'}</button>`).join('');
    const minSelect = `<div class="row" style="gap:6px"><span class="lbl">At least</span><select data-change="minlen" style="width:auto;padding:5px 10px;font-size:13px;border-radius:999px">${[15, 30, 45, 60, 90, 120, 180].map(m => `<option value="${m}" ${m === S.minLen ? 'selected' : ''}>${L.fmtDur(m)}</option>`).join('')}</select></div>`;
    const warn = res.unconfirmedIds.length ? `<div class="banner"><span>Waiting on <b>${names(res.unconfirmedIds)}</b> to confirm. Deselect them to see free time for the rest.</span></div>` : '';
    const grid = gridHTML(d => {
      if (!sel.length) return {};
      if (res.blocked) return { cls: 'unk' };
      return { html: busy[d].map(([a, b]) => boxHTML('busyw', a, b)).join('') + res.windows.filter(w => w.day === d).map(w => boxHTML('freew', w.start, w.end)).join('') };
    });
    const winSummary = (!res.blocked && res.windows.length)
      ? `<div class="card"><b>${res.windows.length} time${res.windows.length > 1 ? 's' : ''} everyone is free</b><div class="win-chips">${res.windows.map(w => `<span class="win-chip">${DAYS[w.day]} ${L.fmtTime(w.start)}&ndash;${L.fmtTime(w.end)} (${L.fmtDur(w.end - w.start)})</span>`).join('')}</div></div>`
      : (!res.blocked && sel.length ? '<div class="card empty">No shared free time this week. Try a shorter length.</div>' : '');
    return `${weekControlsHTML(modeToggle)}
      <div class="subbar"><div class="chips">${chips}</div>${minSelect}</div>
      ${warn}${winSummary}${grid}`;
  }
}

function studyHTML(t) {
  const ps = S.db.people, now = new Date();
  const ids = L.effectiveAssignees(t, ps);
  const r = L.suggestStudySlots({ task: t, personIds: ids, blocks: S.db.blocks, confirmations: S.db.confirmations, today: todayStr(), nowMin: now.getHours() * 60 + now.getMinutes(), dayStart: hs(), dayEnd: he() });
  let h = `<div class="study"><b>Times everyone is free before it's due</b>`;
  if (r.status === 'no-assignees') h += '<p class="mute" style="margin:4px 0 0">No assignees.</p>';
  else if (r.status === 'no-time-left') h += '<p class="mute" style="margin:4px 0 0">No days remaining before due date.</p>';
  else if (r.slots.length) h += `<ol>${r.slots.map((s, i) => `<li>${i === 0 ? '<b>Best:</b> ' : ''}${fmtLong(s.date)}, ${L.fmtTime(s.start)} &ndash; ${L.fmtTime(s.end)} <span class="mute">(${L.fmtDur(s.end - s.start)})</span></li>`).join('')}</ol>`;
  else h += '<p class="mute" style="margin:4px 0 0">No common free window found.</p>';
  if (r.skippedWeeks.length) h += `<p class="hint">Skipped unconfirmed weeks: ${r.skippedWeeks.map(w => `week of ${fmtShort(w.weekDate)} (${names(w.unconfirmedIds)})`).join('; ')}</p>`;
  return h + '</div>';
}

function tasksHTML() {
  const ps = S.db.people, today = todayStr();
  const ts = S.db.tasks.filter(t => S.filter === 'all' || t.category === S.filter)
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0));
  const filt = ['all', 'shared', 'group', 'personal'].map(c => `<button class="${S.filter === c ? 'on' : ''}" data-act="filter" data-v="${c}">${c[0].toUpperCase() + c.slice(1)}</button>`).join('');
  const rows = ts.map(t => {
    const ids = L.effectiveAssignees(t, ps), diff = L.daysBetween(today, t.dueDate);
    const due = t.status === 'done' ? '' : diff < 0 ? `<span class="over">${-diff}d overdue</span>` : diff === 0 ? '<b>due today</b>' : `in ${diff}d`;
    const who = t.category === 'shared' ? 'Everyone' : names(ids);
    return `<div class="task ${t.status === 'done' ? 'done' : ''}">
      <div>
        <div><span class="tt"><b>${esc(t.title)}</b></span><span class="badge">${t.category}</span></div>
        <div class="mute" style="font-size:13px;margin-top:4px">${ids.map(i => `<span class="dot" style="background:${person(i).color}"></span>`).join('')}${who} &middot; Due ${fmtLong(t.dueDate)} ${due ? '(' + due + ')' : ''}</div>
      </div>
      <div class="acts">
        <select data-change="status" data-id="${t.id}" aria-label="Status">${[['todo', 'To do'], ['doing', 'In progress'], ['done', 'Done']].map(([v, l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${t.status !== 'done' ? `<button class="btn sm ghost" data-act="study" data-id="${t.id}">Find time</button>` : ''}
        <button class="btn sm quiet" data-act="edittask" data-id="${t.id}">Edit</button>
        <button class="btn sm quiet danger" data-act="deltask" data-id="${t.id}" aria-label="Delete task">&#10005;</button>
      </div>
      ${S.studyFor === t.id ? studyHTML(t) : ''}
    </div>`;
  }).join('') || `<div class="empty">Nothing here yet.<br><button class="btn sm" style="margin-top:12px" data-act="opentask">+ New task</button></div>`;

  return `<div class="toolbar"><div class="seg">${filt}</div><button class="btn sm" data-act="opentask">+ New task</button></div>
    <div class="card">${rows}</div>${taskModalHTML()}`;
}

function settingsHTML() {
  const hrs = (from, to, cur) => { let o = ''; for (let h = from; h <= to; h++) o += `<option value="${h}" ${h === cur ? 'selected' : ''}>${L.fmtTime(h * 60)}</option>`; return o; };
  const rows = S.db.types.map(t => `<div class="trow"><input type="color" value="${t.color}" data-change="typeedit" data-tid="${t.id}" data-tf="color" aria-label="Color"><input type="text" value="${esc(t.name)}" maxlength="20" data-change="typeedit" data-tid="${t.id}" data-tf="name" aria-label="Name"><span class="badge" style="margin:0">${t.repeat === 'weekly' ? 'weekly' : '1-week'}</span><button class="btn sm ghost" data-act="deltype" data-id="${t.id}">Delete</button></div>`).join('');
  return `<div class="row2" style="align-items:start">
    <div class="card"><h3>Event types</h3><p class="hint" style="margin:4px 0 16px"><b>Weekly</b> types repeat every week. <b>1-week</b> types apply only to the week entered.</p>
      ${rows}${S.typeErr ? `<div class="err">${esc(S.typeErr)}</div>` : ''}
      <form data-submit="addtype" class="trow" style="margin-top:14px"><input type="color" value="${S.newType.color}" data-nt="color" aria-label="Color"><input type="text" placeholder="Add a type" maxlength="20" value="${esc(S.newType.name)}" data-nt="name"><select data-nt="repeat" style="width:auto"><option value="weekly" ${S.newType.repeat === 'weekly' ? 'selected' : ''}>Weekly</option><option value="week" ${S.newType.repeat === 'week' ? 'selected' : ''}>1-week</option></select><button class="btn">Add</button></form>
    </div>
    <div class="card"><h3 style="margin-bottom:16px">Calendar</h3>
      <div class="row2"><label>Day starts<select data-change="hstart">${hrs(0, 23, S.hStart)}</select></label><label>Day ends<select data-change="hend">${hrs(S.hStart + 1, 24, S.hEnd)}</select></label></div>
      <label>Snap to<select data-change="snap">${[5, 10, 15, 20, 30, 60].map(m => `<option value="${m}" ${m === S.snap ? 'selected' : ''}>${m} minutes</option>`).join('')}</select></label>
      <p class="hint">Free-time searches and study suggestions scan within your visible grid hours.</p>
    </div>
  </div>`;
}

function render() {
  const y = window.scrollY;
  const me = person(S.me);
  if (!me || S.managing) { $app.innerHTML = profileHTML(); return; }
  const tabs = [['mine', 'My week'], ['group', 'Group'], ['tasks', 'Tasks'], ['settings', 'Settings']];
  const body = { mine: () => mineHTML(me), group: groupHTML, tasks: tasksHTML, settings: settingsHTML }[S.tab]();
  $app.innerHTML = `<div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><div class="logo-mark">S</div><h1>Planner</h1></div>
        <nav>${tabs.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>
      </div>
      <div class="user-actions">
        <button class="link" data-act="switch" title="Switch User"><span class="dot" style="background:${me.color}"></span>${esc(me.name)} &#9662;</button>
        <button class="link" data-act="theme" title="Theme: ${THEMES[S.theme]}" aria-label="Change theme">${{ auto: '&#9680;', light: '&#9788;', dark: '&#9790;' }[S.theme]}</button>
      </div>
    </header>
    ${body}
  </div>`;
  S.anchor = null;
  window.scrollTo(0, y);
}

// ---------- editing interactions on the "My Schedule" grid ----------
let lastPT = 'mouse';
const colOf = el => el && el.closest ? el.closest('#grid.edit .tg-col') : null;
const minAt = (col, y) => { const r = col.getBoundingClientRect(); return Math.max(hs(), Math.min(he(), hs() + (y - r.top) / PPH * 60)); };
function rangeOf(a, b) {
  let lo = L.snapFloor(Math.min(a, b), S.snap), hi = Math.min(he(), L.snapFloor(Math.max(a, b), S.snap) + S.snap);
  lo = Math.min(lo, hi - S.snap);
  return [Math.max(hs(), lo), hi];
}
function showBand(col, lo, hi) {
  let el = col.querySelector('.band');
  if (!el) { el = document.createElement('div'); el.className = 'band'; col.appendChild(el); }
  const p = place(lo, hi); if (!p) return;
  el.style.top = p.top + 'px'; el.style.height = p.h + 'px';
}
const clearBands = () => document.querySelectorAll('.band').forEach(b => b.remove());

async function staleFor(weekDates) {
  const wk = L.mondayOf(todayStr());
  const ids = S.db.confirmations.filter(c => c.personId === S.me && weekDates.some(w => w == null ? c.weekDate >= wk : c.weekDate === w)).map(c => c.id);
  if (ids.length) await Repo.remove('confirmations', ids);
}
function newBlock(day, start, end, t) {
  return { id: uid(), personId: S.me, day, start, end, type: t.id, weekDate: L.weekDateFor(t, null, S.week), label: S.newLabel.trim(), private: !!S.newPrivate };
}
async function commitDrag(d, lo, hi) {
  const t = curType(), b = newBlock(d, lo, hi, t);
  if (L.validateBlock(b, S.db.types).length) { render(); return; }
  S.newLabel = '';
  await act(async () => { await Repo.upsert('blocks', b); await staleFor([b.weekDate]); });
}
document.addEventListener('pointerdown', e => {
  lastPT = e.pointerType;
  if (e.pointerType === 'touch' || e.button !== 0 || e.target.closest('.blk')) return;
  const col = colOf(e.target); if (!col) return;
  e.preventDefault();
  const m = minAt(col, e.clientY);
  S.drag = { col, d: +col.dataset.d, y0: e.clientY, a: m, b: m, moved: false };
});
document.addEventListener('pointermove', e => {
  const dr = S.drag; if (!dr) return;
  dr.b = minAt(dr.col, e.clientY);
  if (Math.abs(e.clientY - dr.y0) >= 4) dr.moved = true;
  if (dr.moved) { const [lo, hi] = rangeOf(dr.a, dr.b); showBand(dr.col, lo, hi); }
});
document.addEventListener('pointerup', () => {
  const dr = S.drag; if (!dr) return;
  S.drag = null; clearBands();
  if (!dr.moved) return;
  const [lo, hi] = rangeOf(dr.a, dr.b);
  commitDrag(dr.d, lo, hi);
});
document.addEventListener('pointercancel', () => { S.drag = null; clearBands(); });

// ---------- clicks, forms ----------
function openEditor(id) {
  const b = S.db.blocks.find(x => x.id === id); if (!b) return;
  S.editBlock = id; S.editErr = [];
  S.editForm = { type: b.type, label: b.label || '', day: b.day, start: L.fmtTimeInput(b.start), end: L.fmtTimeInput(b.end), private: !!b.private };
  render();
}
document.addEventListener('click', async e => {
  const blk = e.target.closest('.blk');
  if (blk) {
    if (S.tab === 'mine') openEditor(blk.dataset.id);
    else if (S.tab === 'group' && S.groupMode === 'overlay') { S.peek = S.peek === blk.dataset.id ? null : blk.dataset.id; render(); }
    return;
  }
  const col = colOf(e.target);
  if (col) {
    if (lastPT !== 'touch') return;
    const d = +col.dataset.d, m = minAt(col, e.clientY);
    if (S.anchor && S.anchor.d === d) { const a = S.anchor.a; S.anchor = null; clearBands(); const [lo, hi] = rangeOf(a, m); commitDrag(d, lo, hi); }
    else { clearBands(); S.anchor = { d, a: m }; const [lo, hi] = rangeOf(m, m); showBand(col, lo, hi); }
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if ((a === 'closemodal' || a === 'cancelblock' || a === 'canceledit') && e.target !== el) return; // click bubbled from inside the modal, not a backdrop tap
  const go = () => { savePrefs(); render(); };
  if (a === 'pick') { S.me = id; S.managing = false; resetTransient(); go(); }
  else if (a === 'switch') { S.managing = true; render(); }
  else if (a === 'closeprofile') { S.managing = false; render(); }
  else if (a === 'theme') { S.theme = { auto: 'dark', dark: 'light', light: 'auto' }[S.theme]; applyTheme(); go(); }
  else if (a === 'delperson') {
    const p = person(id);
    if (!confirm(`Remove ${p.name} and all of their schedule data?`)) return;
    const c = L.cascadeRemovePerson(S.db, id);
    await act(async () => {
      await Repo.remove('blocks', c.blockIds); await Repo.remove('confirmations', c.confIds);
      if (c.upsertTasks.length) await Repo.upsert('tasks', c.upsertTasks);
      if (c.deleteTaskIds.length) await Repo.remove('tasks', c.deleteTaskIds);
      await Repo.remove('people', id);
    });
    if (S.me === id) S.me = null;
    if (S.gapSel) S.gapSel = S.gapSel.filter(x => x !== id);
    go();
  }
  else if (a === 'tab') { S.tab = v; resetTransient(); go(); }
  else if (a === 'gmode') { S.groupMode = v; S.peek = null; go(); }
  else if (a === 'closepeek') { S.peek = null; render(); }
  else if (a === 'wk') { S.week = L.addDays(S.week, 7 * +v); resetTransient(); render(); }
  else if (a === 'thisweek') { S.week = L.mondayOf(todayStr()); resetTransient(); render(); }
  else if (a === 'openadd') { S.showAddModal = true; S.addErr = []; render(); }
  else if (a === 'closemodal') { S.showAddModal = false; S.addErr = []; render(); }
  else if (a === 'typesel') { S.typeSel = id; go(); }
  else if (a === 'newday') { const d = +v; S.newDays = S.newDays.includes(d) ? S.newDays.filter(x => x !== d) : [...S.newDays, d].sort(); render(); }
  else if (a === 'editblock') openEditor(id);
  else if (a === 'cancelblock') { resetTransient(); render(); }
  else if (a === 'delblock') {
    const b = S.db.blocks.find(x => x.id === S.editBlock); if (!b) return;
    resetTransient();
    await act(async () => { await Repo.remove('blocks', b.id); await staleFor([b.weekDate]); });
  }
  else if (a === 'copy') {
    const r = L.copyWeekBlocks(S.db.blocks, S.me, L.addDays(S.week, -7), S.week, uid);
    if (!r.add.length) { alert('No 1-week events found in the previous week. Weekly events repeat automatically.'); return; }
    if (r.remove.length && !confirm(`Replace the ${r.remove.length} 1-week event(s) already in this week with last week's ${r.add.length}?`)) return;
    await act(async () => { if (r.remove.length) await Repo.remove('blocks', r.remove); await Repo.upsert('blocks', r.add); await staleFor([S.week]); });
  }
  else if (a === 'confirm') {
    await act(async () => {
      if (L.isConfirmed(S.db.confirmations, S.me, S.week)) await Repo.remove('confirmations', confId(S.me, S.week));
      else await Repo.upsert('confirmations', { id: confId(S.me, S.week), personId: S.me, weekDate: S.week, confirmedAt: Date.now() });
    });
  }
  else if (a === 'vis') { S.visible[id] = S.visible[id] === false; go(); }
  else if (a === 'gsel') { const cur = selIds(); S.gapSel = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]; go(); }
  else if (a === 'deltype') {
    const n = S.db.blocks.filter(b => b.type === id).length;
    if (S.db.types.length <= 1) S.typeErr = 'Keep at least one type.';
    else if (n) S.typeErr = `${n} event(s) still use this type. Change or delete those events first.`;
    else { S.typeErr = ''; await act(() => Repo.remove('types', id)); return; }
    render();
  }
  else if (a === 'filter') { S.filter = v; render(); }
  else if (a === 'opentask') { S.form = newForm(); S.editing = null; S.formErr = []; S.showTaskModal = true; render(); }
  else if (a === 'assignee') {
    const f = S.form;
    if (f.category === 'personal') f.assigneeIds = [id];
    else f.assigneeIds = f.assigneeIds.includes(id) ? f.assigneeIds.filter(x => x !== id) : [...f.assigneeIds, id];
    render();
  }
  else if (a === 'study') { S.studyFor = S.studyFor === id ? null : id; render(); }
  else if (a === 'edittask') {
    const t = S.db.tasks.find(x => x.id === id);
    S.form = { title: t.title, category: t.category, assigneeIds: t.assigneeIds.slice(), dueDate: t.dueDate };
    S.editing = id; S.showTaskModal = true; S.formErr = []; render();
  }
  else if (a === 'canceledit') { S.editing = null; S.showTaskModal = false; S.form = newForm(); S.formErr = []; render(); }
  else if (a === 'deltask') { if (confirm('Delete this task?')) await act(() => Repo.remove('tasks', id)); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const k = e.target.dataset.submit;
  if (k === 'addperson') {
    const name = document.getElementById('newname').value.trim();
    if (!name) return;
    if (S.db.people.some(p => p.name.toLowerCase() === name.toLowerCase())) { alert('That name already exists.'); return; }
    if (S.db.people.length >= PALETTE.length) { alert('Maximum of ' + PALETTE.length + ' people.'); return; }
    const used = S.db.people.map(p => p.color);
    await act(() => Repo.upsert('people', { id: uid(), name, color: PALETTE.find(c => !used.includes(c)) }));
  } else if (k === 'addevent') {
    const t = curType(), start = L.parseTimeInput(S.timeStart, false), end = L.parseTimeInput(S.timeEnd, true), errs = [];
    if (!S.newDays.length) errs.push('Pick at least one day.');
    if (start == null || end == null) errs.push('Enter valid start and end times.');
    else errs.push(...L.validateBlock({ day: 0, start, end, type: t.id, label: S.newLabel }, S.db.types));
    S.addErr = [...new Set(errs)];
    if (S.addErr.length) { render(); return; }
    const blocks = S.newDays.map(d => newBlock(d, start, end, t));
    S.newLabel = ''; S.newDays = []; S.showAddModal = false;
    await act(async () => { await Repo.upsert('blocks', blocks); await staleFor([blocks[0].weekDate]); });
  } else if (k === 'saveblock') {
    const old = S.db.blocks.find(b => b.id === S.editBlock); if (!old) return;
    const f = S.editForm, t = tOf(f.type), start = L.parseTimeInput(f.start, false), end = L.parseTimeInput(f.end, true);
    const nb = { ...old, type: t.id, label: f.label.trim(), day: +f.day, start, end, private: !!f.private, weekDate: L.weekDateFor(t, old.weekDate, S.week) };
    S.editErr = start == null || end == null ? ['Enter valid start and end times.'] : L.validateBlock(nb, S.db.types);
    if (S.editErr.length) { render(); return; }
    resetTransient();
    await act(async () => { await Repo.upsert('blocks', nb); await staleFor([old.weekDate, nb.weekDate]); });
  } else if (k === 'addtype') {
    const nt = { id: uid(), name: S.newType.name.trim(), color: S.newType.color, repeat: S.newType.repeat };
    const errs = L.validateType(nt, S.db.types);
    if (errs.length) { S.typeErr = errs[0]; render(); return; }
    S.typeErr = '';
    const used = S.db.types.map(t => t.color.toLowerCase()).concat(nt.color.toLowerCase());
    S.newType = { name: '', color: TYPE_COLORS.find(c => !used.includes(c)) || TYPE_COLORS[0], repeat: nt.repeat };
    await act(() => Repo.upsert('types', nt));
  } else if (k === 'savetask') {
    const f = S.form, old = S.db.tasks.find(t => t.id === S.editing);
    const t = { id: S.editing || uid(), title: f.title.trim(), category: f.category,
      assigneeIds: f.category === 'shared' ? S.db.people.map(p => p.id) : f.assigneeIds.slice(),
      dueDate: f.dueDate, status: old ? old.status : 'todo' };
    S.formErr = L.validateTask(t, S.db.people);
    if (S.formErr.length) { render(); return; }
    S.editing = null; S.showTaskModal = false; S.form = newForm();
    await act(() => Repo.upsert('tasks', t));
  }
});

document.addEventListener('input', e => {
  const d = e.target.dataset, val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (d.f) S.form[d.f] = val;
  else if (d.sv) S[d.sv] = val;
  else if (d.ef && S.editForm) S.editForm[d.ef] = val;
  else if (d.nt) S.newType[d.nt] = val;
});
document.addEventListener('change', async e => {
  const k = e.target.dataset.change; if (!k) return;
  const v = e.target.value;
  if (k === 'cat') {
    const prev = S.form.category;
    S.form.category = v;
    if (prev === 'shared') S.form.assigneeIds = [S.me];
    else if (v === 'personal') S.form.assigneeIds = [S.form.assigneeIds[0] || S.me];
    render();
  } else if (k === 'minlen') { S.minLen = +v; savePrefs(); render(); }
  else if (k === 'hstart') { S.hStart = +v; if (S.hEnd <= S.hStart) S.hEnd = Math.min(24, S.hStart + 1); savePrefs(); render(); }
  else if (k === 'hend') { S.hEnd = +v; savePrefs(); render(); }
  else if (k === 'snap') { S.snap = +v; savePrefs(); render(); }
  else if (k === 'status') {
    const t = S.db.tasks.find(x => x.id === e.target.dataset.id);
    await act(() => Repo.upsert('tasks', { ...t, status: v }));
  } else if (k === 'typeedit') {
    const t = S.db.types.find(x => x.id === e.target.dataset.tid); if (!t) return;
    const nt = { ...t, [e.target.dataset.tf]: e.target.dataset.tf === 'name' ? v.trim() : v };
    const errs = L.validateType(nt, S.db.types);
    if (errs.length) { S.typeErr = errs[0]; render(); return; }
    S.typeErr = '';
    await act(() => Repo.upsert('types', nt));
  }
});

(async () => {
  S.db = await Repo.loadAll();
  if (!S.db.types.length) { await Repo.upsert('types', L.DEFAULT_TYPES.map(t => ({ ...t }))); S.db = await Repo.loadAll(); }
  applyTheme(); render();
  Repo.onExternalChange(async () => { S.db = await Repo.loadAll(); if (!S.drag) render(); });
})();
</script>
</body>
